<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Questionário de WCAG</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
      max-width: 600px;
      margin: 0 auto;
    }

    h1:focus, legend:focus, .resultado:focus {
      outline: 3px solid #005fcc;
      outline-offset: 4px;
    }

    .container-questao {
      background-color: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px;
      margin-top: 20px;
      text-align: left;
    }

    fieldset {
      border: none;
      padding: 0;
      margin: 0;
    }

    legend {
      font-size: 1.2em;
      font-weight: bold;
      margin-bottom: 15px;
      padding: 5px;
      display: block;
      width: 100%;
    }

    .opcoes {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Rótulo clicável unificado */
    .opcao-label {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      user-select: none;
    }

    .opcao-label:hover {
      background-color: #ececec;
    }

    input[type="radio"] {
      width: 22px;
      height: 22px;
      margin: 0;
      cursor: pointer;
      flex-shrink: 0;
    }

    button {
      margin-top: 20px;
      padding: 12px 24px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #218838;
    }

    .btn-secundario {
      background-color: #005fcc;
    }

    .btn-secundario:hover {
      background-color: #004494;
    }

    .resultado {
      font-size: 18px;
      font-weight: bold;
      margin-top: 20px;
      padding: 15px;
      border-radius: 5px;
      background-color: #e2e3e5;
    }

    .botoes-resultado {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>

  <main>
    <h1 id="titulo-quiz" tabindex="-1">Questionário de Acessibilidade Web (WCAG)</h1>

    <div id="area-quiz" class="container-questao">
      <form id="form-quiz" onsubmit="event.preventDefault();">
        <fieldset>
          <legend id="enunciado" tabindex="-1"></legend>
          <div id="container-opcoes" class="opcoes"></div>
        </fieldset>

        <button type="button" id="btnProxima">Próxima questão</button>
      </form>
    </div>

    <!-- Área do Resultado Final -->
    <div id="area-resultado" class="resultado" style="display: none;" tabindex="-1">
      <p id="mensagem-resultado"></p>
      <div class="botoes-resultado">
        <button type="button" id="btnReiniciar">Tentar novamente</button>
        <button type="button" id="btnHome" class="btn-secundario">Voltar para a Home</button>
      </div>
    </div>
  </main>

  <script>
    const tituloQuiz = document.getElementById('titulo-quiz');
    
    setTimeout(function() {
      tituloQuiz.focus();
    }, 100);

    const perguntas = [
      {
        pergunta: "1. Quantos princípios fundamentais sustentam as diretrizes da WCAG?",
        opcoes: ["3 princípios", "4 princípios", "5 princípios", "6 princípios"],
        correta: 1
      },
      {    
        pergunta: "2. Qual o papel do atributo 'alt' em elementos de imagem HTML?",
        opcoes: [
          "Mudar a cor da imagem",
          "Fornecer uma descrição textual para leitores de tela",
          "Aumentar a resolução da imagem",
          "Criar um atalho de teclado"
        ],
        correta: 1
      },
      {
        pergunta: "3. O que garante o princípio 'Operável' da WCAG?",
        opcoes: [
          "Que o site só funcione em celulares",
          "Que os componentes de interface e navegação sejam utilizáveis (ex: via teclado)",
          "Que todo o texto esteja em maiúsculas",
          "Que o código seja escrito apenas em JavaScript"
        ],
        correta: 1
      },
      {
        pergunta: "4. Qual é o nível intermediário de conformidade da WCAG mais adotado mundialmente?",
        opcoes: ["Nível A", "Nível AA", "Nível AAA", "Nível AAAA"],
        correta: 1
      }
    ];

    let questaoAtual = 0;
    let pontuacao = 0;

    const elementoEnunciado = document.getElementById('enunciado');
    const containerOpcoes = document.getElementById('container-opcoes');
    const btnProxima = document.getElementById('btnProxima');
    const areaQuiz = document.getElementById('area-quiz');
    const areaResultado = document.getElementById('area-resultado');
    const mensagemResultado = document.getElementById('mensagem-resultado');
    const btnReiniciar = document.getElementById('btnReiniciar');
    const btnHome = document.getElementById('btnHome');

    function carregarQuestao() {
      const q = perguntas[questaoAtual];
      elementoEnunciado.textContent = q.pergunta;
      containerOpcoes.innerHTML = '';

      q.opcoes.forEach((opcao, index) => {
        const letra = String.fromCharCode(97 + index); // a, b, c, d
        const textoOpcao = `${letra}) ${opcao}`;

        // Cria o label que envolve todo o elemento
        const label = document.createElement('label');
        label.className = 'opcao-label';

        // Cria o input radio
        const radio = document.createElement('input');
        radio.type = 'radio';
        radio.name = `resposta`;
        radio.value = index;
        
        // Atribui o aria-label para garantir que o TalkBack leia o texto junto com o estado do botão
        radio.setAttribute('aria-label', textoOpcao);

        // Cria o nó de texto visível
        const spanTexto = document.createElement('span');
        spanTexto.textContent = textoOpcao;

        // Monta a estrutura: <label><input> <span>texto</span></label>
        label.appendChild(radio);
        label.appendChild(spanTexto);
        containerOpcoes.appendChild(label);
      });

      // Foca no enunciado ao mudar de questão
      setTimeout(function() {
        elementoEnunciado.focus();
      }, 150);
    }

    btnProxima.addEventListener('click', function() {
      const opcaoSelecionada = document.querySelector('input[name="resposta"]:checked');

      if (!opcaoSelecionada) {
        alert("Por favor, selecione uma opção antes de prosseguir.");
        return;
      }

      if (parseInt(opcaoSelecionada.value) === perguntas[questaoAtual].correta) {
        pontuacao++;
      }

      questaoAtual++;

      if (questaoAtual < perguntas.length) {
        carregarQuestao();
      } else {
        exibirResultado();
      }
    });

    function exibirResultado() {
      areaQuiz.style.display = 'none';
      areaResultado.style.display = 'block';

      if (pontuacao === 4) {
        mensagemResultado.textContent = `Acertou ${pontuacao} de 4 questões. Parabéns, você domina o assunto!`;
      } else if (pontuacao >= 2 && pontuacao <= 3) {
        mensagemResultado.textContent = `Acertou ${pontuacao} de 4 questões. Você tem um breve conhecimento do tema.`;
      } else {
        mensagemResultado.textContent = `Acertou ${pontuacao} de 4 questões. Você precisa aprofundar mais o assunto.`;
      }

      setTimeout(function() {
        areaResultado.focus();
      }, 100);
    }

    btnReiniciar.addEventListener('click', function() {
      questaoAtual = 0;
      pontuacao = 0;
      areaResultado.style.display = 'none';
      areaQuiz.style.display = 'block';
      carregarQuestao();
    });

    btnHome.addEventListener('click', function() {
      window.location.href = 'index.html';
    });

    carregarQuestao();
  </script>

</body>
</html>
